
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAVE POINT — Game Library</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#090812;
  --panel:#151323;
  --purple:#8b5cf6;
  --blue:#35baff;
  --text:#f4f0ff;
  --muted:#9993ae;
  --border:#302944;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
}

header {
  padding:28px 6%;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo {
  font-family:'Press Start 2P',cursive;
  font-size:18px;
  color:var(--purple);
  text-shadow:3px 3px var(--blue);
}

.tagline {
  color:var(--muted);
  letter-spacing:3px;
  font-size:13px;
}

main {
  max-width:1400px;
  margin:auto;
  padding:45px 6%;
}

.hero h1 {
  font-family:'Press Start 2P',cursive;
  font-size:clamp(20px,4vw,38px);
  line-height:1.7;
  max-width:800px;
}

.hero p { color:var(--muted); }

.search {
  width:100%;
  padding:16px;
  margin:25px 0;
  background:var(--panel);
  border:1px solid var(--border);
  color:white;
  font-family:inherit;
  font-size:18px;
  outline:none;
}

.filters {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:30px;
}

.filters button {
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 18px;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
}

.filters button.active,
.filters button:hover {
  background:var(--purple);
  border-color:var(--purple);
}

.info {
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  margin-bottom:18px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}

.card {
  background:var(--panel);
  border:1px solid var(--border);
  overflow:hidden;
  transition:.2s;
}

.card:hover {
  transform:translateY(-5px);
  border-color:var(--purple);
  box-shadow:0 8px 25px #8b5cf633;
}

.cover {
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
  background:#211b32;
}

.card-content { padding:15px; }

.platform {
  color:var(--blue);
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
}

.name {
  font-size:22px;
  font-weight:700;
  margin:8px 0;
  min-height:52px;
}

.price {
  font-size:20px;
  color:var(--purple);
  font-weight:700;
}

.status {
  display:inline-block;
  margin-top:10px;
  padding:4px 9px;
  border:1px solid var(--blue);
  color:var(--blue);
  font-size:13px;
}

.empty {
  grid-column:1/-1;
  text-align:center;
  padding:50px;
  color:var(--muted);
}

footer {
  text-align:center;
  padding:35px;
  border-top:1px solid var(--border);
  color:var(--muted);
}

@media(max-width:900px) {
  .grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
}

@media(max-width:600px) {
  header { padding:22px 5%; }
  .logo { font-size:14px; }
  .tagline { font-size:10px; }
  main { padding:30px 5%; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .name { font-size:18px; }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">SAVE POINT</div>
    <div class="tagline">YOUR GAME COLLECTION</div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>LEVEL UP YOUR GAME LIBRARY.</h1>
    <p>Discover your next adventure.</p>
  </section>

  <input
    class="search"
    id="search"
    type="search"
    placeholder="Search your favorite game..."
  >

  <div class="filters">
    <button class="active" data-platform="ALL">ALL GAMES</button>
    <button data-platform="PS4">PS4</button>
    <button data-platform="PS5">PS5</button>
    <button data-platform="NINTENDO SWITCH">NINTENDO SWITCH</button>
  </div>

  <div class="info">
    <span>GAME COLLECTION</span>
    <span id="count">Loading...</span>
  </div>

  <section class="grid" id="games">
    <div class="empty">Loading game library...</div>
  </section>
</main>

<footer>
  SAVE POINT © 2026 — PLAY MORE, SAVE MORE
</footer>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRrXW9ukBwUNbsVW2p2re5PtJrUrQPpW2RnX-RKW-hOs1bSp51nbyrSASDzSX9ts2dU08rPrY2wKjgi/pub?gid=2128239766&single=true&output=csv";

let allGames = [];
let activePlatform = "ALL";

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (c === '"' && quoted && next === '"') {
      value += '"';
      i++;
    } else if (c === '"') {
      quoted = !quoted;
    } else if (c === ',' && !quoted) {
      row.push(value);
      value = "";
    } else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && next === '\n') i++;
      row.push(value);
      if (row.some(cell => cell.trim() !== "")) rows.push(row);
      row = [];
      value = "";
    } else {
      value += c;
    }
  }

  row.push(value);
  if (row.some(cell => cell.trim() !== "")) rows.push(row);

  return rows;
}

function getCoverUrl(url) {
  if (!url) return "";

  url = url.trim();

  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/)
    || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if (url.includes("drive.google.com") && driveMatch) {
    return "https://drive.google.com/thumbnail?id=" +
      driveMatch[1] + "&sz=w600";
  }

  return url;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

async function loadGames() {
  const container = document.getElementById("games");

  try {
    const response = await fetch(CSV_URL);
    if (!response.ok) throw new Error("Gagal mengambil data spreadsheet");

    const csv = await response.text();
    const rows = parseCSV(csv);

    if (rows.length < 2) {
      allGames = [];
      renderGames();
      return;
    }

    const headers = rows[0].map(h => h.trim().toLowerCase());

    allGames = rows.slice(1).map(row => {
      const item = {};
      headers.forEach((header, index) => {
        item[header] = (row[index] || "").trim();
      });
      return item;
    }).filter(game => game.name);

    renderGames();

  } catch (error) {
    container.innerHTML =
      '<div class="empty">Data game gagal dimuat. Periksa link CSV dan pengaturan publikasi Google Sheets.</div>';
    document.getElementById("count").textContent = "Error";
    console.error(error);
  }
}

function renderGames() {
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = allGames.filter(game => {
    const platform = (game.platform || "").toUpperCase();
    const matchesPlatform =
      activePlatform === "ALL" || platform === activePlatform;

    const matchesSearch =
      (game.name || "").toLowerCase().includes(search);

    return matchesPlatform && matchesSearch;
  });

  document.getElementById("count").textContent =
    filtered.length + " GAMES";

  const container = document.getElementById("games");

  if (!filtered.length) {
    container.innerHTML =
      '<div class="empty">No games found.</div>';
    return;
  }

  container.innerHTML = filtered.map(game => {
    const cover = getCoverUrl(game.cover);
    const price = game.price
      ? "Rp " + Number(game.price.replace(/[^\d]/g, "") || 0).toLocaleString("id-ID")
      : "Price unavailable";

    return `
      <article class="card">
        <img
          class="cover"
          src="${escapeHTML(cover || "https://placehold.co/400x550/211b32/ffffff?text=SAVE+POINT")}"
          alt="${escapeHTML(game.name)}"
          loading="lazy"
          onerror="this.onerror=null;this.src='https://placehold.co/400x550/211b32/ffffff?text=NO+COVER';"
        >
        <div class="card-content">
          <div class="platform">${escapeHTML(game.platform || "")}</div>
          <div class="name">${escapeHTML(game.name)}</div>
          <div class="price">${escapeHTML(price)}</div>
          <div class="status">${escapeHTML(game.status || "Available")}</div>
        </div>
      </article>
    `;
  }).join("");
}

document.getElementById("search").addEventListener("input", renderGames);

document.querySelectorAll(".filters button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filters button")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
    activePlatform = button.dataset.platform;
    renderGames();
  });
});

loadGames();
</script>

</body>
</html>
